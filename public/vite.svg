     width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-label="Moviq M logo — modern minimalist cinematic">
  <!-- Background (dark cinematic tone) -->
  <rect width="512" height="512" fill="#1c1c1f" rx="96" ry="96"/>

  <!-- Stylized “M” -->
  <path d="M120 384V140h64l72 112 72-112h64v244h-64V252l-72 112-72-112v132z"
