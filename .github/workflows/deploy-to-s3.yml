name: Deploy Vite Build to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1             
  BUCKET_NAME: moviq     
  INDEX_DOCUMENT: index.html
  ERROR_DOCUMENT: index.html

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 🪣 Step 6: Ensure S3 bucket exists and is configured for website hosting
      - name: Ensure S3 bucket exists and configure website
        run: |
          set -e

          echo "Checking if bucket exists..."
          if aws s3api head-bucket --bucket $BUCKET_NAME 2>/dev/null; then
            echo "✅ Bucket exists: $BUCKET_NAME"
          else
            echo "🪣 Creating new bucket: $BUCKET_NAME"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket $BUCKET_NAME
            else
              aws s3api create-bucket \
                --bucket $BUCKET_NAME \
                --create-bucket-configuration LocationConstraint=$AWS_REGION
            fi
          fi

          echo "🔓 Disabling Public Access Block..."
          aws s3api put-public-access-block \
            --bucket $BUCKET_NAME \
            --public-access-block-configuration BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false

          echo "🌐 Enabling static website hosting..."
          aws s3 website s3://$BUCKET_NAME/ \
            --index-document $INDEX_DOCUMENT \
            --error-document $ERROR_DOCUMENT

          echo "📝 Applying public-read bucket policy..."
          cat > bucket-policy.json <<POLICY
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadGetObject",
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::$BUCKET_NAME/*"
              }
            ]
          }
          POLICY

          aws s3api put-bucket-policy --bucket $BUCKET_NAME --policy file://bucket-policy.json

      # ☁️ Step 7: Upload Vite build to S3
      - name: Upload build to S3
        run: |
          DIST_DIR="dist"

          echo "🚀 Syncing files to S3..."
          aws s3 sync $DIST_DIR s3://$BUCKET_NAME \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

          echo "📄 Uploading index.html with no caching..."
          aws s3 cp $DIST_DIR/index.html s3://$BUCKET_NAME/index.html \
            --cache-control "no-store" \
            --content-type "text/html; charset=utf-8"

      # 🌍 Step 8: Show the live website URL
      - name: Display S3 Website URL
        run: |
          echo "✅ Deployment complete!"
          echo "🌐 Website URL: http://$BUCKET_NAME.s3-website-$AWS_REGION.amazonaws.com"
